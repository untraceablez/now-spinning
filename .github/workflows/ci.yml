name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # PortAudio for sounddevice; SDL still needs to link even with the dummy
      # video driver the tests use.
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libportaudio2 libsdl2-2.0-0

      - name: Install
        run: python -m pip install --upgrade pip && pip install -e '.[dev]'

      - name: Test
        env:
          SDL_VIDEODRIVER: dummy
        run: pytest -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y libportaudio2 libsdl2-2.0-0

      - name: Install
        run: python -m pip install --upgrade pip && pip install -e '.[dev]'

      - name: Ruff
        run: |
          ruff check --output-format=github .
          ruff format --check .

      # Pinned to 3.12: numpy's stubs use syntax older interpreters cannot parse.
      - name: Mypy
        run: mypy nowspinning
