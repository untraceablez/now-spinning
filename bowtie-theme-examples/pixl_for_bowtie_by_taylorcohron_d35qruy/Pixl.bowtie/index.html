	<script type="text/javascript">
	oldPlayState = 0;
	function $(el) { return document.getElementById(el); }
	function trackUpdate(track)
	{
		var title = track.property('title');
		var artist = track.property('artist');
		updateRatingUI(iTunes.rating());
		
		$('title').innerHTML = title;
		$('title2').innerHTML = title;
		$('artist').innerHTML = artist;
		$('artist2').innerHTML = artist;

	}

	function playerUpdate()
	{
		var pState = iTunes.playState();
		if (pState != oldPlayState)
		{
			if (pState == 0 || pState == 2)
				$('playLink').innerHTML = '<img src="play.png">';
			else
				$('playLink').innerHTML = '<img src="pause.png">';
			
			oldPlayState = pState;
		}
	}
	
	function artworkUpdate(artURL)
	{		
		if (artURL == "")
		{
			$('art').src = "noartwork.png";
			setTimeout(function(){Reflection.add($('art'));}, 50);
		}
		else
		{
			$('art').src = artURL;
			setTimeout(function(){Reflection.add($('art'));}, 50);
		}
	}
	
	function playPause()
	{
		iTunes.playPause();
		playerUpdate();
	}
	
	function setRating(rating)
	{
		updateRatingUI(rating);
		iTunes.setRating(rating);
	}
	
	function updateRatingUI(rating)
	{
		if(rating > 0){
			$('star1').innerHTML = "★";
		} else {
			$('star1').innerHTML = "☆";
		}

		if(rating > 20){
			$('star2').innerHTML = "★";
		} else {
			$('star2').innerHTML = "☆";
		}

		if(rating > 40){
			$('star3').innerHTML = "★";
		} else {
			$('star3').innerHTML = "☆";
		}

		if(rating > 60){
			$('star4').innerHTML = "★";
		} else {
			$('star4').innerHTML = "☆";
		}

		if(rating > 80){
			$('star5').innerHTML = "★";
		} else {
			$('star5').innerHTML = "☆";
		}
	}
	
	// Opacity
	
	function opacity(id, opacStart, opacEnd, millisec) { 
  	  //speed for each frame 
 	   var speed = Math.round(millisec / 100); 
 	   var timer = 0; 

 	   //determine the direction for the blending, if start and end are the same nothing happens 
 	   if(opacStart > opacEnd) { 
 	       for(i = opacStart; i >= opacEnd; i--) { 
  	          setTimeout("changeOpac(" + i + ",'" + id + "')",(timer * speed)); 
 	           timer++; 
 	       } 
 	   } else if(opacStart < opacEnd) { 
	        for(i = opacStart; i <= opacEnd; i++) 
  	          { 
 	           setTimeout("changeOpac(" + i + ",'" + id + "')",(timer * speed)); 
 	           timer++; 
 	       } 
 	   }
	} 

	//change the opacity for different browsers 
	function changeOpac(opacity, id) { 
 	   var object = document.getElementById(id).style; 
	    object.opacity = (opacity / 100);
		if(object.opacity == 0) {
			document.getElementById(id).style.display = "none";
		} else {
			document.getElementById(id).style.display = "block";
		}
	}
	
	function shiftOpacity(id, millisec) { 
    //if an element is invisible, make it visible, else make it ivisible 
		if(document.getElementById(id).style.opacity == 0) {
			opacity(id, 0, 100, millisec); 
		} else { 
			opacity(id, 100, 0, millisec);
		} 
	}

	</script>
	<script type="text/javascript">
	mouseDown = false;
	mouseX = 0;
	mouseY = 0;
	
	mouseStartX = 0;
	mouseStartY = 0;
	startFrame = [];
	document.onmousedown = function(e){
		mouseDown = true;
		
		mouseStartX = e.screenX;
		mouseStartY = e.screenY;
		startFrame = Bowtie.frame();
	}
	document.onmouseup = function(){
		mouseDown = false;
	}
	document.onmousemove = function(e){
		mouseX = e.screenX;
		mouseY = e.screenY;
		
		if (mouseDown)
		{
			deltaX = mouseX - mouseStartX;
			deltaY = mouseStartY - mouseY;	// flipped coordinate system
			
			Bowtie.setFrame(startFrame[0]+deltaX, startFrame[1]+deltaY, startFrame[2], startFrame[3]);
		}
	}
	</script>
