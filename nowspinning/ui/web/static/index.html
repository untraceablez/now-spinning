<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>now spinning</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23141418'/%3E%3Ccircle cx='16' cy='16' r='10' fill='none' stroke='%232a2a30'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23c8a24a'/%3E%3Ccircle cx='16' cy='16' r='1.4' fill='%23141418'/%3E%3C/svg%3E" />
  <style>
    html, body { height: 100%; margin: 0; background: #101014; color: #f5f2ea; font-family: system-ui; }
    body { display: flex; justify-content: center; align-items: center; }
    .loading { text-align: center; }
  </style>
</head>
<body>
  <div class="loading">Loading theme...</div>

  <script>
    window.nowSpinning = {
      _listeners: { stateChange: [], configChange: [] },
      state: null,
      config: {
        server_url: window.location.origin,
        theme_name: 'default',
        geometry: null,
        display: null,
      },

      onStateChange(callback) {
        this._listeners.stateChange.push(callback);
        if (this.state) callback(this.state);
      },

      onConfigChange(callback) {
        this._listeners.configChange.push(callback);
      },

      _fireStateChange(state) {
        this.state = state;
        this._listeners.stateChange.forEach(cb => cb(state));
      },

      _fireConfigChange() {
        this._listeners.configChange.forEach(cb => cb(this.config));
      },

      getAssetUrl(filename) {
        const theme = this.config.theme_name || 'default';
        return `/api/themes/${theme}/assets/${filename}`;
      },

      getArtworkUrl(artwork_id) {
        return `/api/art/${artwork_id}`;
      },
    };

    async function loadTheme() {
      try {
        const params = new URLSearchParams(window.location.search);
        const themeName = params.get('theme') || 'default';

        const configResp = await fetch(`/api/themes/${themeName}/config`);
        if (!configResp.ok) throw new Error(`Failed to load theme config: ${configResp.statusText}`);
        const config = await configResp.json();

        window.nowSpinning.config = { ...window.nowSpinning.config, ...config };
        window.nowSpinning._fireConfigChange();

        const htmlResp = await fetch(`/api/themes/${themeName}/index.html`);
        if (!htmlResp.ok) throw new Error(`Failed to load theme HTML`);
        const html = await htmlResp.text();

        document.documentElement.innerHTML = html;

        const scriptResp = await fetch(`/api/themes/${themeName}/script.js`);
        if (scriptResp.ok) {
          const text = await scriptResp.text();
          const s = document.createElement('script');
          s.textContent = text;
          document.body.appendChild(s);
        }

        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = `/api/themes/${themeName}/style.css`;
        document.head.appendChild(link);

      } catch (error) {
        console.error('Failed to load theme:', error);
        document.body.innerHTML = `<div class="loading" style="color: #ff6b6b;">Error: ${error.message}</div>`;
      }
    }

    loadTheme();
  </script>
</body>
</html>
