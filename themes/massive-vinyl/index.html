<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#101014" />
<title>now spinning</title>
<!-- Inline, so a kiosk browser does not log a 404 for a file that does not exist. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23141418'/%3E%3Ccircle cx='16' cy='16' r='10' fill='none' stroke='%232a2a30'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23c8a24a'/%3E%3Ccircle cx='16' cy='16' r='1.4' fill='%23141418'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <!-- The blurred wash of the cover, when display.background_mode is "artwork". -->
  <div class="wash" id="wash" aria-hidden="true"></div>

  <main class="stage" id="stage" data-status="idle" data-style="sleeve">
    <div class="visual">
      <!-- Sleeve style: the same sleeve.png the panel uses, drawn twice and
           clipped, so the jacket and the record can be shown independently. -->
      <div class="artwork" id="artwork">
        <div class="art-shadow" id="artShadow" aria-hidden="true"></div>
        <img class="cover" id="cover" alt="" />
        <div class="disc-layer" id="discLayer" aria-hidden="true">
          <img class="sleeve-img" id="discImg" alt="" />
          <div class="sheen-crescent" id="sheenCrescent">
            <div class="sheen" id="sheen"></div>
          </div>
        </div>
        <img class="sleeve-img jacket" id="jacketImg" alt="" aria-hidden="true" />
      </div>

      <!-- Record style: the cover on the label of a turning platter. -->
      <div class="record" id="record" aria-hidden="true">
        <div class="grooves"></div>
        <div class="label" id="label"><img id="labelArt" alt="" hidden /></div>
        <div class="spindle"></div>
      </div>
    </div>

    <section class="meta" id="meta">
      <p class="heading" id="heading">Ready</p>
      <h1 class="title" id="title">Drop the needle</h1>
      <p class="artist" id="artist"></p>
      <p class="album" id="album"></p>
      <p class="note" id="note"></p>
    </section>
  </main>

  <div class="connection" id="connection" hidden>reconnecting&hellip;</div>
  <script src="/static/app.js"></script>
</body>
</html>
